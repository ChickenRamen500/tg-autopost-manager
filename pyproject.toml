[project]
name = "tg-media-queue-bot"
version = "0.2.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PR-40: asyncio_mode = "auto" — позволяет использовать `async def test_...`
# без явного `@pytest.mark.asyncio`. Текущие тесты используют sync def + asyncio.run
# (как в Фазе 1), но新模式 позволит добавлять async-тесты в будущем.
asyncio_mode = "auto"
# -p no:cacheprovider — отключает кеш pytest (для CI / reproducible runs).
# Локально для `--lf` (last-failed) кеш нужен: можно убрать эту строку.
# Оставляем для совместимости с CI (без polluted .pytest_cache).
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "BLE"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
"scripts/*" = ["BLE001"]
