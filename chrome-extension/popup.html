<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 300px; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 12px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    #queues { list-style: none; padding: 0; margin: 0 0 10px; }
    #queues li { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 6px; background: #f2f4f7; margin-bottom: 4px; }
    #queues li b { color: #2AABEE; }
    .muted { color: #6b7480; }
    .btns { display: flex; gap: 8px; }
    button { flex: 1; padding: 7px 0; border: none; border-radius: 7px; cursor: pointer; font-weight: 600; }
    #enqueue { background: #2AABEE; color: #fff; }
    #options { background: #e8ebef; color: #333; }
    #status { margin-top: 8px; min-height: 16px; font-size: 12px; }
    #status.ok { color: #2e7d32; } #status.err { color: #c62828; }
  </style>
</head>
<body>
  <h3>📤 Send to TG Bot</h3>
  <div id="pageinfo" class="muted">—</div>
  <ul id="queues"><li class="muted">Загрузка очередей…</li></ul>
  <div class="btns">
    <button id="enqueue">→ В очередь (эту страницу)</button>
    <button id="options">⚙</button>
  </div>
  <div id="status"></div>
  <script src="site-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
