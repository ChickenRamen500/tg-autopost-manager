services:
  # Local Bot API Server (снимает лимиты 50 МБ upload / 20 МБ download) — ТЗ §3.2
  local-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: tg-lba          # короткое имя для `docker logs tg-lba` (гайд PHASE1_GUIDE.md)
    restart: always
    environment:
      # Образ aiogram/telegram-bot-api:latest читает эти переменные своим entrypoint-скриптом
      # и сам собирает команду `telegram-bot-api --api-id=... --api-hash=... --local ...`.
      # Не используем секцию `command:` — на Windows PowerShell интерполяция ${VAR} в folded
      # YAML-блоке нестабильна, и при пустом .env флаги `--api-id=` / `--api-hash=` / `--local`
      # молча отбрасываются, контейнер стартует БЕЗ --local и не слушает порт корректно.
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID обязателен для local-bot-api — получи на https://my.telegram.org}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH обязателен для local-bot-api — получи на https://my.telegram.org}
      # TELEGRAM_LOCAL=1 → entrypoint-скрипт образа добавляет флаг `--local`
      # (снимает лимиты 50 МБ upload / 20 МБ download — ТЗ §3.2)
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"   # только localhost: local-bot-api не имеет auth, не выставлять наружу
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Корневой GET возвращает HTTP 403 (сервер жив, просто отказал в доступе к `/`).
      # /getMe без токена не отвечает и подвешивает коннект — старый тест вешал healthcheck.
      # Если telegram-bot-api стартует БЕЗ --local (например, из-за пустых TELEGRAM_API_ID/HASH),
      # он не открывает 8081 → curl exit code 7 (Connection refused) ≠ 22 → unhealthy.
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/ || [ $$? -eq 22 ] || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Основной бот
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    depends_on:
      local-bot-api:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Кросс-платформенный путь к медиа (Windows/Linux/macOS):
      # переопределяется MEDIA_HOST_DIR в .env (по умолчанию ./data/media относительно compose-файла)
      - ${MEDIA_HOST_DIR:-./data/media}:/app/media
      # Прямой доступ к файлам local-bot-api (файлы >20МБ нельзя скачать через облачное getFile)
      - bot-api-data:/app/bot-api-data:ro
    ports:
      - "127.0.0.1:8000:8000"     # только localhost: веб-интерфейс за reverse-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  bot-api-data:
