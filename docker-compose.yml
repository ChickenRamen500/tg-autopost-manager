services:
  # Local Bot API Server (снимает лимиты 50 МБ upload / 20 МБ download) — ТЗ §3.2
  local-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: tg-lba          # короткое имя для `docker logs tg-lba` (гайд PHASE1_GUIDE.md)
    restart: always
    environment:
      # сервер читает эти переменные сам — надёжнее, чем подстановка в command
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
    command: >
      --api-id=${TELEGRAM_API_ID}
      --api-hash=${TELEGRAM_API_HASH}
      --local
      --dir=/var/lib/telegram-bot-api
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"   # только localhost: local-bot-api не имеет auth, не выставлять наружу
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # корневой GET возвращает HTTP 403 (сервер жив); /getMe без токена не отвечает
      # и подвешивает коннект — старый тест вешал docker healthcheck и запросы из контейнера
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/ || [ $$? -eq 22 ] || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Основной бот
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    depends_on:
      local-bot-api:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Кросс-платформенный путь к медиа (Windows/Linux/macOS):
      # переопределяется MEDIA_HOST_DIR в .env (по умолчанию ./data/media относительно compose-файла)
      - ${MEDIA_HOST_DIR:-./data/media}:/app/media
      # Прямой доступ к файлам local-bot-api (файлы >20МБ нельзя скачать через облачное getFile)
      - bot-api-data:/app/bot-api-data:ro
    ports:
      - "127.0.0.1:8000:8000"     # только localhost: веб-интерфейс за reverse-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  bot-api-data:
